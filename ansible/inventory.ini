# Inventario de las 2 VMs de Vagrant (Vagrantfile) para el despliegue con Ansible.
# backend = 192.168.56.10 (3 microservicios), frontend = 192.168.56.20 (nginx).
# Credenciales por defecto de la box oficial ubuntu/jammy64 (usuario vagrant).

[backend]
192.168.56.10

[frontend]
192.168.56.20

[all:vars]
ansible_user=vagrant
ansible_password=vagrant
ansible_become_password=vagrant
ansible_python_interpreter=/usr/bin/python3
